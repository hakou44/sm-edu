name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Set Android version from package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          IFS=. read -r MA MI PA <<< "$VERSION"
          CODE=$(( (MA*10000 + MI*100 + PA) * 1000 + (GITHUB_RUN_NUMBER % 1000) ))
          GRADLE=android/app/build.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode $CODE/; s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" "$GRADLE"
          grep -nE "versionCode|versionName" "$GRADLE"

      - name: Generate app icons (Android)
        run: npx --yes @capacitor/assets generate --android --assetPath assets

      - name: Keep the APK small (papers and lessons are downloaded from the content server)
        run: rm -rf web/exams

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: SM_EDUCATION-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
